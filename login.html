<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | ShopEase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="topbar text-center py-2">
      Free shipping on orders over ৳2,000 <span id="clock"></span>
    </div>
    <header class="container py-3">
      <a class="brand" href="index.html">ShopEase<span>.</span></a>
    </header>
    <nav class="navbar navbar-expand-lg navbar-dark main-nav">
      <div class="container">
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product-detail.html">Product Detail</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="signup.html">Sign Up</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="login.html">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="form-section">
      <form class="form-card" id="loginForm">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login</h1>
        <p class="text-muted mb-4">Enter your account details to continue.</p>
        <div class="mb-3">
          <label class="form-label">Username</label
          ><input class="form-control" required placeholder="Your username" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label
          ><input
            class="form-control"
            type="password"
            required
            placeholder="Your password"
          />
        </div>
        <button class="btn btn-accent w-100" type="submit">Login</button>
        <p class="text-center mt-4 mb-0">
          Don't have an account? <a href="signup.html">Register</a>
        </p>
      </form>
    </main>
    <footer class="footer">
      <div class="container py-4">
        <a class="brand text-white" href="index.html">ShopEase<span>.</span></a>
        <p>© 2026 ShopEase.</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
