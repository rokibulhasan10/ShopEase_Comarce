<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up | ShopEase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="topbar text-center py-2">
      Free shipping on orders over ৳2,000 <span id="clock"></span>
    </div>
    <header class="container py-3">
      <a class="brand" href="index.html">ShopEase<span>.</span></a>
    </header>
    <nav class="navbar navbar-expand-lg navbar-dark main-nav">
      <div class="container">
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product-detail.html">Product Detail</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="signup.html">Sign Up</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="form-section">
      <form class="form-card" id="signupForm">
        <p class="eyebrow">JOIN OUR COMMUNITY</p>
        <h1>Create Account</h1>
        <p class="text-muted mb-4">Sign up to discover your new favorites.</p>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">First Name</label
            ><input class="form-control" required placeholder="First name" />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Last Name</label
            ><input class="form-control" required placeholder="Last name" />
          </div>
          <div class="col-12">
            <label class="form-label">Phone</label
            ><input
              class="form-control"
              type="tel"
              required
              placeholder="01XXXXXXXXX"
            />
          </div>
          <div class="col-12">
            <label class="form-label">Email</label
            ><input
              class="form-control"
              type="email"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="col-12">
            <label class="form-label">Username</label
            ><input
              class="form-control"
              required
              placeholder="Choose a username"
            />
          </div>
          <div class="col-12">
            <label class="form-label">Password</label
            ><input
              class="form-control"
              type="password"
              required
              placeholder="Create a password"
            />
          </div>
          <div class="col-12">
            <button class="btn btn-accent w-100" type="submit">
              Create account
            </button>
          </div>
        </div>
        <p class="text-center mt-4 mb-0">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </form>
    </main>
    <footer class="footer">
      <div class="container py-4">
        <a class="brand text-white" href="index.html">ShopEase<span>.</span></a>
        <p>© 2026 ShopEase.</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
